<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☁️ Cloud Phone</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a1a; color: #fff; min-height: 100vh; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 24px; background: rgba(26, 26, 46, 0.9); border-bottom: 1px solid #2d2d44; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
        .logo { display: flex; align-items: center; gap: 10px; }
        .logo .icon { font-size: 28px; }
        .logo h1 { font-size: 22px; font-weight: 700; background: linear-gradient(135deg, #4ade80, #22d3ee); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .user-info { display: flex; align-items: center; gap: 10px; background: #1a1a2e; padding: 6px 12px 6px 6px; border-radius: 30px; border: 1px solid #2d2d44; }
        .user-info img { width: 32px; height: 32px; border-radius: 50%; }
        .user-info span { font-size: 14px; color: #9ca3af; }
        .stats { display: flex; justify-content: space-around; padding: 20px 24px; background: #1a1a2e; margin: 16px 20px; border-radius: 16px; border: 1px solid #2d2d44; }
        .stat-item { text-align: center; }
        .stat-number { font-size: 28px; font-weight: 700; color: #4ade80; display: block; }
        .stat-label { font-size: 12px; color: #6b7280; }
        .stat-divider { width: 1px; background: #2d2d44; }
        .region-selector { padding: 0 20px; margin-bottom: 16px; }
        .region-selector label { display: block; color: #9ca3af; font-size: 14px; margin-bottom: 10px; }
        .region-grid { display: flex; flex-wrap: wrap; gap: 8px; }
        .region-btn { padding: 8px 16px; background: #1a1a2e; border: 1px solid #2d2d44; border-radius: 20px; color: #9ca3af; font-size: 13px; cursor: pointer; transition: all 0.3s; }
        .region-btn:hover { border-color: #4ade80; color: #fff; }
        .region-btn.active { background: #4ade80; border-color: #4ade80; color: #0a0a1a; font-weight: 600; }
        .btn-create { width: calc(100% - 40px); margin: 0 20px 20px; padding: 16px; background: linear-gradient(135deg, #4ade80, #22d3ee); border: none; border-radius: 12px; color: #0a0a1a; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.3s; }
        .btn-create:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(74, 222, 128, 0.3); }
        .btn-create:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .vm-list { padding: 0 20px 100px; }
        .vm-card { background: #1a1a2e; border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 1px solid #2d2d44; display: flex; align-items: center; justify-content: space-between; transition: all 0.3s; cursor: pointer; }
        .vm-card:hover { border-color: #4ade80; transform: translateX(4px); box-shadow: 0 4px 20px rgba(74, 222, 128, 0.1); }
        .vm-card.disabled { opacity: 0.5; cursor: not-allowed; }
        .vm-card.disabled:hover { transform: none; border-color: #2d2d44; }
        .vm-info { flex: 1; }
        .vm-name { font-size: 16px; font-weight: 600; color: #fff; }
        .vm-region { font-size: 12px; color: #6b7280; margin-top: 2px; }
        .vm-time { font-size: 12px; color: #fbbf24; margin-top: 2px; }
        .vm-status { display: flex; align-items: center; gap: 6px; margin-right: 12px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .status-dot.online { background: #4ade80; animation: pulse 2s infinite; }
        .status-dot.offline { background: #ef4444; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .vm-arrow { font-size: 20px; color: #4ade80; transition: all 0.3s; }
        .vm-card:hover .vm-arrow { transform: translateX(4px); }
        .empty-state { text-align: center; padding: 60px 20px; }
        .empty-icon { font-size: 64px; display: block; margin-bottom: 16px; }
        .empty-state h3 { font-size: 20px; color: #fff; margin-bottom: 8px; }
        .empty-state p { color: #6b7280; font-size: 14px; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.95); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal.active { display: flex; }
        .modal-content { background: #1a1a2e; border-radius: 20px; width: 100%; max-width: 1000px; max-height: 95vh; display: flex; flex-direction: column; overflow: hidden; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; background: #2d2d44; }
        .modal-header h2 { font-size: 18px; color: #fff; }
        .btn-close { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; padding: 0 8px; }
        .modal-body { flex: 1; padding: 20px; overflow: auto; background: #0a0a1a; }
        .screen-container { background: #000; border-radius: 12px; aspect-ratio: 16/9; position: relative; overflow: hidden; }
        .screen-container iframe { width: 100%; height: 100%; border: none; }
        .screen-placeholder { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; color: #6b7280; }
        .loading-spinner { width: 40px; height: 40px; border: 4px solid #2d2d44; border-top-color: #4ade80; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .modal-footer { display: flex; align-items: center; gap: 16px; padding: 12px 24px; background: #2d2d44; color: #9ca3af; font-size: 13px; }
        .time-remaining { margin-left: auto; color: #fbbf24; font-weight: 600; }
        @media (max-width: 600px) { header { padding: 12px 16px; } .logo h1 { font-size: 18px; } .stats { padding: 16px; margin: 12px; } .stat-number { font-size: 22px; } .vm-card { flex-wrap: wrap; gap: 8px; } .modal-content { max-height: 95vh; } .screen-container { aspect-ratio: 9/16; } }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a1a; }
        ::-webkit-scrollbar-thumb { background: #2d2d44; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #4ade80; }
    </style>
</head>
<body>
    <header>
        <div class="logo"><span class="icon">☁️</span><h1>Cloud Phone</h1></div>
        <div class="user-info"><img src="https://ui-avatars.com/api/?name=User&background=4ade80&color=fff"><span>User</span></div>
    </header>
    <div class="stats">
        <div class="stat-item"><span class="stat-number" id="activeCount">0</span><span class="stat-label">Đang hoạt động</span></div>
        <div class="stat-divider"></div>
        <div class="stat-item"><span class="stat-number">4</span><span class="stat-label">Giới hạn</span></div>
        <div class="stat-divider"></div>
        <div class="stat-item"><span class="stat-number" id="totalCount">0</span><span class="stat-label">Tổng máy</span></div>
    </div>
    <div class="region-selector">
        <label>🌍 Chọn vùng máy chủ:</label>
        <div class="region-grid" id="regionGrid"></div>
    </div>
    <button class="btn-create" id="btnCreate">🚀 Tạo máy ảo mới</button>
    <div class="vm-list" id="vmList">
        <div class="empty-state"><span class="empty-icon">📱</span><h3>Chưa có máy ảo</h3><p>Nhấn nút bên trên để tạo máy ảo đầu tiên</p></div>
    </div>
    <div class="modal" id="modalConnect">
        <div class="modal-content">
            <div class="modal-header"><h2 id="modalTitle">🖥️ Đang kết nối...</h2><button class="btn-close" id="btnCloseModal">✕</button></div>
            <div class="modal-body">
                <div class="screen-container">
                    <div class="screen-placeholder" id="screenPlaceholder"><div class="loading-spinner"></div><p>Đang kết nối đến máy ảo...</p><small>WebRTC Stream - Độ trễ thấp</small></div>
                    <iframe id="screenFrame" style="display:none; width:100%; height:100%; border:none;"></iframe>
                </div>
            </div>
            <div class="modal-footer"><span class="status-dot online"></span><span>Đang hoạt động</span><span class="time-remaining" id="timeRemaining">⏱ 23:59:59</span></div>
        </div>
    </div>
    <script>
        // ===== CẤU HÌNH API =====
        const API_URL = 'http://<IP_SERVER>:3000/api'; // Thay IP_SERVER bằng IP thật
        const userId = 'user_' + Math.random().toString(36).substr(2, 9);
        let selectedRegion = 'singapore';
        let countdownInterval = null;

        // DOM elements
        const regionGrid = document.getElementById('regionGrid');
        const vmList = document.getElementById('vmList');
        const btnCreate = document.getElementById('btnCreate');
        const activeCount = document.getElementById('activeCount');
        const totalCount = document.getElementById('totalCount');
        const modal = document.getElementById('modalConnect');
        const modalTitle = document.getElementById('modalTitle');
        const screenPlaceholder = document.getElementById('screenPlaceholder');
        const screenFrame = document.getElementById('screenFrame');
        const timeRemaining = document.getElementById('timeRemaining');
        const btnCloseModal = document.getElementById('btnCloseModal');
        let currentVM = null;

        // Load regions
        async function loadRegions() {
            try {
                const res = await fetch(`${API_URL}/regions`);
                const regions = await res.json();
                regionGrid.innerHTML = regions.map(r => `
                    <button class="region-btn ${r.id === selectedRegion ? 'active' : ''}" 
                            data-id="${r.id}"
                            onclick="selectRegion('${r.id}')">
                        ${r.flag} ${r.name}
                    </button>
                `).join('');
            } catch (error) {
                console.error('Lỗi tải vùng:', error);
            }
        }

        function selectRegion(id) {
            selectedRegion = id;
            document.querySelectorAll('.region-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.id === id);
            });
        }

        // Load VMs
        async function loadVMs() {
            try {
                const res = await fetch(`${API_URL}/list/${userId}`);
                const vms = await res.json();
                renderVMs(vms);
                updateStats(vms);
            } catch (error) {
                console.error('Lỗi tải máy ảo:', error);
            }
        }

        function renderVMs(vms) {
            if (vms.length === 0) {
                vmList.innerHTML = `<div class="empty-state"><span class="empty-icon">📱</span><h3>Chưa có máy ảo</h3><p>Nhấn nút bên trên để tạo máy ảo đầu tiên</p></div>`;
                return;
            }
            vmList.innerHTML = vms.map(vm => {
                const isExpired = vm.expired || vm.status === 'error';
                const timeLeft = isExpired ? 0 : Math.max(0, 24 - (Date.now() - vm.created) / (3600 * 1000));
                const hours = Math.floor(timeLeft);
                const minutes = Math.floor((timeLeft - hours) * 60);
                return `
                    <div class="vm-card ${isExpired ? 'disabled' : ''}" data-vm-id="${vm.id}" onclick="${isExpired ? '' : `openVM('${vm.id}')`}">
                        <div class="vm-info"><div class="vm-name">📱 ${vm.name || vm.id}</div><div class="vm-region">📍 ${vm.region || 'Singapore'}</div><div class="vm-time">⏱ ${isExpired ? 'Đã hết hạn' : `${hours}h ${minutes}m còn lại`}</div></div>
                        <div class="vm-status"><span class="status-dot ${isExpired ? 'offline' : 'online'}"></span><span style="font-size:13px;color:${isExpired ? '#ef4444' : '#4ade80'}">${isExpired ? 'Hết hạn' : 'Online'}</span></div>
                        <div class="vm-arrow">${isExpired ? '🚫' : '▶'}</div>
                    </div>
                `;
            }).join('');
        }

        function updateStats(vms) {
            const active = vms.filter(v => !v.expired && v.status !== 'error').length;
            activeCount.textContent = active;
            totalCount.textContent = vms.length;
            btnCreate.disabled = active >= 4;
            btnCreate.textContent = active >= 4 ? '⚠️ Đã đạt giới hạn 4 máy' : '🚀 Tạo máy ảo mới';
        }

        async function createVM() {
            try {
                btnCreate.disabled = true;
                btnCreate.textContent = '⏳ Đang tạo...';
                const res = await fetch(`${API_URL}/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, region: selectedRegion })
                });
                const data = await res.json();
                if (data.error) { alert('❌ ' + data.error); return; }
                alert('✅ Máy ảo đang được khởi tạo!');
                loadVMs();
            } catch (error) {
                alert('❌ Lỗi tạo máy ảo');
                console.error(error);
            } finally {
                btnCreate.disabled = false;
                btnCreate.textContent = '🚀 Tạo máy ảo mới';
            }
        }

        function openVM(vmId) {
            currentVM = vmId;
            modalTitle.textContent = `Máy ảo ${vmId}`;
            modal.classList.add('active');
            screenPlaceholder.style.display = 'flex';
            screenFrame.style.display = 'none';
            fetch(`${API_URL}/vm/${vmId}`)
                .then(res => res.json())
                .then(vm => {
                    setTimeout(() => {
                        screenPlaceholder.style.display = 'none';
                        screenFrame.style.display = 'block';
                        screenFrame.src = `http://<IP_SERVER>:${vm.port}`; // Thay IP_SERVER
                        startCountdown();
                    }, 1500);
                })
                .catch(err => {
                    console.error('Lỗi:', err);
                    screenPlaceholder.innerHTML = `<span style="font-size:48px;margin-bottom:16px;">❌</span><p>Không thể kết nối</p>`;
                });
        }

        function startCountdown() {
            let time = 24 * 3600;
            if (countdownInterval) clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                time--;
                if (time <= 0) { clearInterval(countdownInterval); timeRemaining.textContent = '⏱ Đã hết hạn'; return; }
                const h = Math.floor(time / 3600);
                const m = Math.floor((time % 3600) / 60);
                const s = time % 60;
                timeRemaining.textContent = `⏱ ${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            }, 1000);
        }

        function closeModal() {
            modal.classList.remove('active');
            if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
            screenFrame.src = '';
            screenPlaceholder.style.display = 'flex';
            screenFrame.style.display = 'none';
            screenPlaceholder.innerHTML = `<div class="loading-spinner"></div><p>Đang kết nối đến máy ảo...</p><small>WebRTC Stream - Độ trễ thấp</small>`;
        }

        btnCloseModal.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
        document.addEventListener('click', (e) => {
            const card = e.target.closest('.vm-card');
            if (!card) return;
            if (e.ctrlKey || e.metaKey) {
                e.preventDefault();
                const vmId = card.dataset.vmId;
                if (confirm(`Xóa máy ${vmId}?`)) {
                    fetch(`${API_URL}/delete/${vmId}`, { method: 'DELETE' }).then(() => loadVMs());
                }
            }
        });

        // Init
        loadRegions();
        loadVMs();
        setInterval(loadVMs, 10000);
    </script>
</body>
  </html>
